<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>2018 • powered by discord.gg/familyhook</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- header -->
    <header class="header">
      <div class="header-top">
        <div class="title-wrap">
          <a href="https://discord.gg/familyhook" target="_blank" rel="noopener noreferrer" class="icon-link">
            <img
              src="icon.png"
              alt="2018"
              class="game-icon"
              width="40"
              height="40"
            >
          </a>
          <div class="title-text-group">
            <h1>2018</h1>
            <a href="https://discord.gg/familyhook" target="_blank" rel="noopener noreferrer" class="title-sub">
              powered by discord.gg/familyhook
            </a>
          </div>
        </div>

        <!-- header right: telemetry & discord button -->
        <div class="header-actions">
          <div class="telemetry">
            <div class="telemetry-item">
              <span class="telemetry-dot" id="status-dot"></span>
              <span class="telemetry-num" id="players-count">0</span>
              <span class="telemetry-label">players</span>
            </div>
            <div class="telemetry-sep"></div>
            <div class="telemetry-item">
              <span class="telemetry-num" id="servers-count">0/13</span>
              <span class="telemetry-label">servers</span>
            </div>
            <button id="refresh-btn" class="telemetry-refresh" title="refresh live counts">
              <svg id="refresh-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
              </svg>
            </button>
          </div>

          <a href="https://discord.gg/familyhook" target="_blank" rel="noopener noreferrer" class="btn-discord" title="join discord.gg/familyhook">
            <svg class="discord-svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
            </svg>
            <span>discord</span>
          </a>
        </div>
      </div>

      <!-- auto-refresh progress bar -->
      <div class="refresh-progress-track">
        <div id="refresh-progress-bar" class="refresh-progress-bar"></div>
      </div>
    </header>

    <!-- server owner contact / promotion notice box -->
    <section class="owner-notice-box">
      <div class="notice-info">
        <span class="notice-badge">server owners</span>
        <p class="notice-text">
          if ur server isn't on the list, reach into our discord server and contact us for listing &amp; promotion.
        </p>
      </div>
      <a href="https://discord.gg/familyhook" target="_blank" rel="noopener noreferrer" class="btn-notice-contact">
        <svg class="discord-svg" width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
        </svg>
        <span>contact on discord</span>
      </a>
    </section>

    <!-- servers list -->
    <main>
      <div id="servers-list" class="servers-list">
        <!-- populated dynamically -->
      </div>
    </main>
  </div>

  <!-- toast container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
